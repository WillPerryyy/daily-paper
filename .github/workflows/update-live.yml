name: Refresh paper

# Hourly, which is deliberate over-scheduling. Prices only move once a day, but
# the market and world headlines come from RSS and go stale quickly - that is
# the whole reason this runs more often than the daily close.
#
# The hourly figure is not what GitHub delivers. Measured over 342 hours to
# 30 Oct 2026, a "5 */3 * * *" cron fired 59 times instead of 114: a 52%
# delivery rate, one run every 5.8 hours rather than three, with the fire
# landing 8 to 162 minutes past the slot. Nothing failed - all 59 runs
# succeeded. GitHub simply drops scheduled runs under load, which is
# documented behaviour, not a fault.
#
# So ask for twice what you need. At the observed rate hourly yields a refresh
# roughly every two hours, and the morning read is covered by three or four
# chances rather than one. The runs cost nothing: the repo is public, so
# Actions minutes are free, and a run takes about 18 seconds. The content-hash
# guard below means a run that finds nothing new does not commit.
#
# The dense weekday block covers the close. GitHub cron is UTC and knows
# nothing about daylight saving, while 16:00 in New York is 20:00 UTC in
# summer and 21:00 UTC in winter, so the block spans both and keeps trying
# for an hour after each. With half the fires dropped, four attempts a
# quarter-hour apart is what it takes for one to land soon after the bell.
#
# This file is now the FALLBACK. api/live.py rebuilds the same payload on
# demand in about a second, so a page open is current regardless of when this
# last ran; the commit only matters when that endpoint is unreachable.
on:
  schedule:
    - cron: "5 * * * *"
    - cron: "5,20,35,50 20-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-paper
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch gate, markets, headlines, weather
        run: python update_live.py

      - name: Commit if the content actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NOW=$(python content_hash.py data/live.json)
          PREV=$(git show HEAD:data/live.json | python content_hash.py -)
          echo "content hash now=$NOW prev=$PREV"
          if [ "$NOW" = "$PREV" ]; then
            echo "nothing moved since the last run - not committing"
            git checkout -- data/live.json
            exit 0
          fi
          CLOSE=$(python -c "import json;print(json.load(open('data/live.json'))['gate'].get('date','?'))")
          git add data/live.json
          git commit -m "live: close $CLOSE, headlines refreshed"
          git push
