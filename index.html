<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Paper">
<meta name="theme-color" content="#edf0ef">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>The Daily Paper</title>
<style>
/* A cool instrument grey, not the warm cream this started as. The reader is
   looking at a measurement first and reading second, and parchment was
   telling him the opposite. */
:root{
  color-scheme:light;
  --paper:#edf0ef; --card:#f8faf9; --rule:#d2d9d7; --rule2:#b6c1be;
  --ink:#0d1a21; --ink2:#45565f; --ink3:#78898f;
  --go:#0e6a4d; --stop:#a33b22; --mark:#15607d; --link:#15607d;
  --sma20:#2a6fd0; --sma50:#a8730d; --sma200:#6f4aa0;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0d1215; --card:#151b1f; --rule:#232c32; --rule2:#36424a;
    --ink:#e8eef0; --ink2:#a7b3ba; --ink3:#76848c;
    --go:#4fb891; --stop:#e07a58; --mark:#6fb4d6; --link:#6fb4d6;
    --sma20:#5c9fe8; --sma50:#e0a63c; --sma200:#a98ad6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0d1215; --card:#151b1f; --rule:#232c32; --rule2:#36424a;
  --ink:#e8eef0; --ink2:#a7b3ba; --ink3:#76848c;
  --go:#4fb891; --stop:#e07a58; --mark:#6fb4d6; --link:#6fb4d6;
  --sma20:#5c9fe8; --sma50:#e0a63c; --sma200:#a98ad6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 16.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--mark);outline-offset:3px;border-radius:1px}

.wrap{max-width:1240px;margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(48px + env(safe-area-inset-bottom))}

/* Masthead as a rule across the top rather than a centred nameplate: this is
   a reading on an instrument, not the front page of a newspaper. */
.mast{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:26px}
.mast h1{margin:0;font-family:var(--sans);font-weight:800;font-stretch:118%;
  font-size:clamp(27px,3.2vw,40px);line-height:.95;letter-spacing:-.015em}
.mast .date{font:400 13.5px/1 var(--mono);color:var(--ink3);margin-left:auto;
  padding-bottom:3px}
.mast button{width:auto;margin:0;padding:7px 13px;border:1px solid var(--rule2);
  border-radius:2px;background:transparent;color:var(--ink2);
  font:500 13px var(--sans);cursor:pointer}
.mast button:hover{border-color:var(--ink3);color:var(--ink)}

h2{font:600 17px/1.25 var(--sans);color:var(--ink);letter-spacing:0;
  margin:38px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--rule2)}
section > h2:first-child{margin-top:0}

/* ------------------------------------------------------------- layout --- */
#body{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.r-side{margin-top:38px}
.r-evidence,.r-read{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.r-evidence{margin-top:36px}
.r-evidence section:last-child{margin-top:38px}
@media (min-width:1100px){
  #body{grid-template-columns:minmax(0,1.5fr) minmax(290px,1fr);
        column-gap:52px;align-items:start}
  .r-verdict{grid-column:1;grid-row:1}
  .r-side{grid-column:2;grid-row:1;margin-top:0}
  .r-evidence{grid-column:1 / -1;grid-template-columns:minmax(0,2.1fr) minmax(230px,1fr);
              column-gap:52px;margin-top:46px}
  .r-evidence section:last-child{margin-top:0}
  .r-read{grid-column:1 / -1;grid-template-columns:repeat(3,minmax(0,1fr));
          column-gap:44px;margin-top:10px}
  .r-read section{min-width:0}
}

/* ------------------------------------------------------------ verdict --- */
.verdict{padding:0 0 2px}
.verdict .big{font-family:var(--sans);font-weight:800;font-stretch:112%;
  font-size:clamp(34px,4.4vw,54px);line-height:1;letter-spacing:-.022em}
.go .big{color:var(--go)} .stop .big{color:var(--stop)} .unk .big{color:var(--ink2)}
.verdict .sub{font-size:17px;color:var(--ink2);margin-top:10px}
.verdict .tiny{font-size:14px;color:var(--ink3);margin-top:7px;max-width:52ch}

.gates{margin-top:20px;border-top:1px solid var(--rule)}
.grow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:12px 0;border-bottom:1px solid var(--rule)}
.grow .lab{font-size:16px}
.grow .sm{display:block;font-size:13.5px;color:var(--ink3);margin-top:1px}
.grow .num{font:600 19px var(--mono);white-space:nowrap;text-align:right;
  font-variant-numeric:tabular-nums}
.grow .num .t{display:block;font:400 12px var(--mono);color:var(--ink3);margin-top:2px}
.ok .num{color:var(--go)} .no .num{color:var(--stop)}

/* The session strip is the one piece of instrumentation on the page, so it is
   the one place allowed to look like an instrument. */
.trail{margin-top:24px}
.trail h3,.chart h3{font:600 14px/1.2 var(--sans);letter-spacing:0;
  color:var(--ink2);margin:0 0 10px}
.trail .tw{overflow-x:auto}
.trail table{border-collapse:collapse;font:13px var(--mono)}
.trail th{font:400 10.5px/1.25 var(--sans);color:var(--ink3);
  padding:0 0 6px;text-align:center;min-width:27px}
.trail th span{display:block;font:500 12px var(--mono);color:var(--ink2)}
.trail th i{font-style:normal}
.trail td{text-align:center;padding:4px 0;border-top:1px solid var(--rule)}
.trail td.lab{font:400 13.5px var(--sans);color:var(--ink2);
  text-align:left;padding-right:16px;white-space:nowrap}
.trail td.p{color:var(--ink3)}
.trail td.b{color:var(--stop);font-weight:600}
.trail tr.vr td{border-top:1px solid var(--ink3)}
.trail tr.vr td.p{color:var(--go);font-weight:600}
.trail .say{margin-top:10px}

/* ------------------------------------------------------------- charts --- */
.chart{margin-top:30px}
.chart:first-child{margin-top:0}
.chart svg{display:block;width:100%;height:auto}
.chart .key{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:11px;
  font-size:14px;color:var(--ink2)}
.chart .key i{display:inline-block;width:22px;height:4px;border-radius:1px;
  vertical-align:3px;margin-right:8px}
.chart .say{font-size:15px;line-height:1.55;color:var(--ink2);margin-top:11px;
  max-width:78ch}
.chart .say b{color:var(--ink);font-weight:600}

/* --------------------------------------------------------------- rows --- */
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.mrow .nm{font-size:15.5px}
.mrow .nm .old{font:400 11.5px var(--mono);color:var(--ink3);margin-left:9px}
.note{font-size:13.5px;line-height:1.5;color:var(--ink3);margin:-2px 0 10px;
  max-width:46ch}
.mrow .nm .sm{color:var(--ink3);font-size:13px}
.mrow .rt{text-align:right;white-space:nowrap}
.mrow .px{font:500 15.5px var(--mono)}
.mrow .ch{font:400 13.5px var(--mono);margin-left:10px}
.up{color:var(--go)} .dn{color:var(--stop)}

.item{padding:13px 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item .h{font:600 16.5px/1.36 var(--sans);letter-spacing:-.005em}
.item .h a{color:var(--ink);text-decoration:none}
.item .h a:hover{color:var(--mark);text-decoration:underline;
  text-underline-offset:3px}
.item .m{font:400 12.5px var(--mono);color:var(--ink3);margin-top:5px}
.item .n{font-size:14.5px;line-height:1.5;color:var(--ink2);margin-top:6px}

.wx{display:flex;gap:16px;align-items:baseline;padding:6px 0}
.wx .t{font:600 38px/1 var(--mono);letter-spacing:-.02em}
.wx .d{font-size:15.5px;color:var(--ink2)}
.wx .d b{color:var(--ink);font-weight:600}
.wx .s{font-size:13.5px;color:var(--ink3);margin-top:4px}

.msg{border-radius:2px;padding:12px 15px;margin:0 0 18px;font-size:15px;
  background:var(--card);border:1px solid var(--rule2);color:var(--ink2)}
.foot{font-size:13px;line-height:1.6;color:var(--ink3);margin-top:44px;
  border-top:1px solid var(--rule);padding-top:14px;max-width:88ch}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--ink3);
  border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;
  vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <h1>The Daily Paper</h1>
    <div class="date" id="date"></div>
    <button id="refresh">Refresh</button>
  </header>
  <div id="body"><p style="color:var(--ink3)"><span class="spin"></span> Loading&hellip;</p></div>
  <div class="foot" id="foot"></div>
</div>

<script>
(function () {
  var BUILD = "2026-11-09a";

  // Where the edition comes from. The page cannot build it itself: Yahoo and
  // all but four of the RSS feeds refuse cross-origin browser requests, so
  // something server-side has to do the fetching.
  //
  // API rebuilds it on demand in about two seconds, which is what makes the
  // news current on every refresh and the gate current within a minute of the
  // close. Same-origin when the site is served from Vercel. To make a copy
  // hosted elsewhere live too, put the absolute endpoint in API_ABS.
  //
  // FALLBACK is the committed file the scheduled job writes. It is only as
  // fresh as the last GitHub Actions run, which is why it is second.
  var API_ABS  = "";
  var API      = API_ABS || (location.protocol === "file:" ? "" : "/api/live");
  var FALLBACK = "data/live.json";
  var $ = function(i){ return document.getElementById(i); };
  var CACHE = "paper.cache";

  // "1 days ago" was showing on every item between 24 and 36 hours old, which
  // is most of the AI section on a quiet day.
  function plural(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function h2(t){ return '<h2>'+esc(t)+'</h2>'; }
  var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtDate(iso){
    var p = String(iso).split("-");
    if(p.length !== 3) return iso;
    var M = ["January","February","March","April","May","June","July",
             "August","September","October","November","December"];
    return parseInt(p[2],10)+" "+M[parseInt(p[1],10)-1]+" "+p[0];
  }

  // Every in-market spell with what TQQQ did over it. The chart can only label
  // the wide ones, so this is where the short spells are actually readable.
  function runsHtml(runs){
    if(!runs || !runs.length) return "";
    var rows = runs.slice().reverse().map(function(r){
      var v = (r.tq===null||r.tq===undefined) ? "&mdash;"
            : (r.tq>=0?"+":"")+r.tq.toFixed(1)+"%";
      var cls = (r.tq===null||r.tq===undefined) ? "" : (r.tq>=0?"up":"dn");
      return '<div class="mrow"><div class="nm">'+esc(fmtShort(r.a))+' &ndash; '+
        esc(fmtShort(r.b))+'<span class="sm"> '+r.n+
        (r.n===1?" session":" sessions")+'</span></div>'+
        '<div class="rt"><span class="px '+cls+'">'+v+'</span></div></div>';
    }).join("");
    return '<h2>Every spell in TQQQ</h2>'+rows;
  }
  function fmtShort(iso){
    var p=String(iso).split("-");
    if(p.length!==3) return iso;
    return parseInt(p[2],10)+" "+MON[parseInt(p[1],10)-1]+" "+p[0].slice(2);
  }

  // The line itself carries the state: green where the rule was invested, grey
  // where it was not. Shaded background bands made the reader map a colour to a
  // region and then back to the price; colouring the line removes that step.
  // One builder, two charts. The five-year view answers "when was the rule in
  // or out", so it carries only the 200-day average and a faint SPY line - at
  // half a pixel per session five lines converge into a solid block at the
  // right-hand edge. The one-year view is where 20 and 50 day averages are
  // wide enough to read.
  // Year or quarter labels along the foot. Shared by every chart: the equity
  // curve has to sit on exactly the same x-axis as the price chart above it,
  // and a second copy of this loop would be free to drift from the first.
  function tickRow(dates, s0, n, X, W, H, mode){
    var out="", seen={};
    for(var i=0;i<n;i++){
      var dt=dates[s0+i], key = mode==="year" ? dt.slice(0,4) : dt.slice(0,7);
      if(seen[key]) continue;
      if(mode!=="year" && ["01","04","07","10"].indexOf(dt.slice(5,7))<0) continue;
      seen[key]=1;
      var x=X(i); if(x<20 || x>W-20) continue;
      var lab = mode==="year" ? dt.slice(0,4) : MON[+dt.slice(5,7)-1]+" "+dt.slice(2,4);
      out += '<text x="'+x.toFixed(1)+'" y="'+(H-6)+'" font-size="12" '+
        'fill="var(--ink3)" text-anchor="middle">'+lab+'</text>';
    }
    return out;
  }

  function drawChart(h, o){
    var n = o.count, s0 = o.start;
    var W=o.W||640, H=o.H, PL=2, PR=2, PT=10, PB=22;
    var win = h.closes.slice(s0, s0+n);
    var lows = win.slice(), i;
    if(o.spy && h.spy && h.spy.length){
      var sc = h.closes[s0] / h.spy[s0];
      for(i=s0;i<s0+n;i++) if(h.spy[i]!=null) lows.push(h.spy[i]*sc);
    }
    var lo=Math.min.apply(null,lows), hi=Math.max.apply(null,lows);
    var lLo=Math.log(lo), lHi=Math.log(hi);
    var lPad=(lHi-lLo)*0.08 || 0.02; lLo-=lPad; lHi+=lPad;
    var X=function(k){ return PL + k/(n-1)*(W-PL-PR); };
    var Y=function(v){ return H-PB - (Math.log(v)-lLo)/(lHi-lLo)*(H-PT-PB); };

    var pre=h.pre||[], all=pre.concat(h.closes), off=pre.length+s0;
    function smaLine(wn, col, wd){
      if(all.length < wn+5) return "";
      var pts=[], run=0;
      for(var k=0;k<all.length;k++){
        run+=all[k];
        if(k>=wn) run-=all[k-wn];
        if(k>=wn-1 && k>=off && k-off<n) pts.push(X(k-off).toFixed(1)+","+Y(run/wn).toFixed(1));
      }
      return pts.length<2 ? "" : '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+
        col+'" stroke-width="'+wd+'" stroke-linejoin="round" opacity="0.9"/>';
    }
    var smas="";
    if(o.smas.indexOf(200)>=0) smas += smaLine(200,"var(--sma200)",1.7);
    if(o.smas.indexOf(50)>=0)  smas += smaLine(50,"var(--sma50)",1.5);
    if(o.smas.indexOf(20)>=0)  smas += smaLine(20,"var(--sma20)",1.3);

    var spyLine="";
    if(o.spy && h.spy && h.spy.length){
      var scale = h.closes[s0] / h.spy[s0], pts=[];
      for(i=0;i<n;i++) if(h.spy[s0+i]!=null) pts.push(X(i).toFixed(1)+","+Y(h.spy[s0+i]*scale).toFixed(1));
      if(pts.length>1) spyLine = '<polyline points="'+pts.join(" ")+'" fill="none" '+
        'stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.4"/>';
    }

    var segs="", i2=0;
    while(i2 < n-1){
      var st=h.sig[s0+i2], j=i2;
      while(j+1 < n && h.sig[s0+j+1]===st) j++;
      var pp=[];
      for(var k2=i2;k2<=Math.min(j+1,n-1);k2++) pp.push(X(k2).toFixed(1)+","+Y(h.closes[s0+k2]).toFixed(1));
      segs += '<polyline points="'+pp.join(" ")+'" fill="none" stroke="'+
        (st==="1"?"var(--go)":"var(--ink3)")+'" stroke-width="'+(st==="1"?"2.8":"1.8")+
        '" stroke-linejoin="round" stroke-linecap="round"'+(st==="1"?"":' opacity="0.5"')+'/>';
      i2 = (j > i2) ? j : i2 + 1;
    }

    var ticks = tickRow(h.dates, s0, n, X, W, H, o.ticks);

    var labs="";
    if(o.labels) (h.runs||[]).forEach(function(rn){
      if(rn.tq===null || rn.tq===undefined) return;
      if(rn.i1 < s0 || rn.i0 > s0+n-1) return;
      var a=Math.max(rn.i0-s0,0), b=Math.min(rn.i1-s0,n-1);
      if(X(b)-X(a) < 22) return;
      var top=Infinity;
      for(var k=a;k<=b;k++) top=Math.min(top,Y(h.closes[s0+k]));
      labs += '<text x="'+((X(a)+X(b))/2).toFixed(1)+'" y="'+Math.max(top-6,10).toFixed(1)+
        '" font-size="11" font-weight="600" fill="var(--go)" text-anchor="middle">'+
        (rn.tq>=0?"+":"")+Math.round(rn.tq)+'%</text>';
    });

    return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+o.aria+'">'+
      ticks+spyLine+smas+segs+labs+
      '<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(h.closes[s0+n-1]).toFixed(1)+'" r="4.5" '+
      'fill="'+(o.inNow?"var(--go)":"var(--stop)")+'"/></svg>';
  }

  function key(items){
    return '<div class="key">'+items.map(function(it){
      return '<span><i style="background:'+it[0]+(it[2]?';opacity:.5':'')+'"></i>'+it[1]+'</span>';
    }).join("")+'</div>';
  }

  function chartHtml(h, inNow, W){
    if(!h || !h.dates || h.dates.length < 20) return "";
    var n=h.closes.length;
    var ones=0; for(var q=0;q<n;q++) if(h.sig[q]==="1") ones++;
    var pct=Math.round(ones/n*100);
    var qr=(h.closes[n-1]/h.closes[0]-1)*100, sr=null;
    if(h.spy && h.spy.length && h.spy[0]) sr=(h.spy[n-1]/h.spy[0]-1)*100;
    var svg=drawChart(h,{start:0,count:n,H:(W&&W>700?250:210),W:W,
      smas:[200],spy:true,labels:true,
      ticks:"year",inNow:inNow,
      aria:"QQQ over five years, green where the rule was invested and grey where it held Treasuries, with the 200-day average and SPY for comparison."});
    return '<div class="chart">'+svg+
      key([["var(--go)","In TQQQ"],["var(--ink3)","In Treasuries",1],
           ["var(--sma200)","200d"],["var(--ink2)","SPY",1]])+
      '<div class="say">QQQ over five years on a log scale, <b>green while the rule '+
      'was invested</b> and grey while it sat out &mdash; in the market <b>'+pct+
      '% of the time</b>.'+(sr===null?"":' SPY is the dashed line, rebased to the same '+
      'start: QQQ <b>'+(qr>=0?"+":"")+Math.round(qr)+'%</b> against SPY <b>'+
      (sr>=0?"+":"")+Math.round(sr)+'%</b>.')+' The dot is today.</div></div>';
  }

  function zoomHtml(h, inNow, W){
    if(!h || !h.closes || h.closes.length < 300) return "";
    var n=h.closes.length, win=252, s0=n-win;
    var svg=drawChart(h,{start:s0,count:win,H:(W&&W>700?230:200),W:W,
      smas:[20,50,200],spy:false,
      labels:false,ticks:"month",inNow:inNow,
      aria:"QQQ over the past year with its 20, 50 and 200 day moving averages."});
    return '<div class="chart">'+svg+
      key([["var(--sma20)","20d"],["var(--sma50)","50d"],["var(--sma200)","200d"]])+
      '<div class="say">The past year only. At five years the 20 and 50 day averages '+
      'sit on top of the price line; this is the span where they separate.</div></div>';
  }

  // The first two charts show the index and where the rule stood in it. This
  // one shows the money, which is a different question: a 3x fund compounds
  // daily, so "in the market 70% of the time" says nothing about what was
  // earned. One continuous line over the whole life of TQQQ - the TLT
  // stretches start from exactly where the TQQQ stretches left off - against
  // SPY given the same $100 on the same day, faint in the background.
  //
  // This chart carries a vertical scale and the price charts do not, because
  // here the numbers are comparable: both lines start at $100 on the same
  // date, so the gap between them at any gridline IS the difference in
  // return, readable without arithmetic.
  function curveHtml(h, inNow, boxWidth){
    var c = h && h.curve;
    if(!c || !c.eq || !c.eq.length || c.eq.length !== (c.sig||"").length) return "";
    // The viewBox is sized to the element, so one user unit is one CSS pixel
    // and a 13px label is 13px on screen. The other charts are fixed at 640
    // and scale down, which turns their labels into 6.8px on a phone - fine
    // for an axis you glance at, useless for one you are meant to read values
    // off, which is the whole point of this one.
    var box = boxWidth || ($("body")||{}).clientWidth || 640;
    var n=c.eq.length, W=Math.max(320, Math.min(1100, box)), H=(W<520?200:280),
        PL=52, PR=8, PT=12, PB=24, i;
    var ref = (c.spy && c.spy.length===n) ? c.spy : null;
    var vals = ref ? c.eq.concat(ref) : c.eq;
    var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
    var lLo=Math.log(lo), lHi=Math.log(hi), pad=(lHi-lLo)*0.06 || 0.02;
    lLo-=pad; lHi+=pad;
    var X=function(k){ return PL + k/(n-1)*(W-PL-PR); };
    var Y=function(v){ return H-PB - (Math.log(v)-lLo)/(lHi-lLo)*(H-PT-PB); };

    // 1, 2, 5 per decade is the standard log ladder: every gap is either 2x or
    // 2.5x, so the rungs stay evenly spaced down the whole axis.
    var grid="", money=function(v){
      return v>=1000 ? "$"+(v/1000)+"k" : "$"+v;
    };
    for(var e=Math.floor(Math.log(lo)/Math.LN10); e<=Math.ceil(Math.log(hi)/Math.LN10); e++){
      [1,2,5].forEach(function(m){
        var v=m*Math.pow(10,e);
        if(v<Math.exp(lLo) || v>Math.exp(lHi)) return;
        var y=Y(v).toFixed(1);
        grid += '<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+
          '" stroke="var(--rule)" stroke-width="1"/>'+
          '<text x="'+(PL-7)+'" y="'+(+y+4).toFixed(1)+'" font-size="13" '+
          'fill="var(--ink3)" text-anchor="end">'+money(v)+'</text>';
      });
    }

    // Seventeen years will not take seventeen labels in 584 pixels, so a year
    // is labelled only when there is room since the last one.
    var ticks="", lastX=-99;
    (c.ticks||[]).forEach(function(t){
      var x=X(t[0]);
      if(x-lastX < 56 || x > W-PR-14) return;
      lastX=x;
      ticks += '<text x="'+x.toFixed(1)+'" y="'+(H-6)+'" font-size="13" '+
        'fill="var(--ink3)" text-anchor="middle">'+t[1]+'</text>';
    });

    var spyLine="";
    if(ref){
      var sp=[];
      for(i=0;i<n;i++) sp.push(X(i).toFixed(1)+","+Y(ref[i]).toFixed(1));
      spyLine = '<polyline points="'+sp.join(" ")+'" fill="none" stroke="var(--ink2)" '+
        'stroke-width="1.4" stroke-dasharray="3 3" opacity="0.45"/>';
    }

    // The segment from point k to k+1 is the asset held over that stretch,
    // which the rule picked at the close of point k - so it is sig[k].
    // Consecutive segments share an endpoint, which is what makes the join
    // seamless where the holding changes.
    var segs="", k=0;
    while(k < n-1){
      var st=c.sig[k], j=k;
      while(j+1 < n-1 && c.sig[j+1]===st) j++;
      var pp=[];
      for(var m2=k;m2<=j+1;m2++) pp.push(X(m2).toFixed(1)+","+Y(c.eq[m2]).toFixed(1));
      segs += '<polyline points="'+pp.join(" ")+'" fill="none" stroke="'+
        (st==="1"?"var(--go)":"var(--ink3)")+'" stroke-width="'+(st==="1"?"2.2":"2")+
        '" stroke-linejoin="round" stroke-linecap="round"/>';
      k = j+1;
    }

    var st=c.stats||{}, yrs=c.years||(n/252);
    var pc=function(v){ return (v>=0?"+":"")+Math.round(v*100).toLocaleString()+"%"; };
    var dollars=function(v){ return "$"+Math.round(v).toLocaleString(); };
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+
      'The value of 100 dollars moved between TQQQ and TLT by the rule since '+
      '2010, with 100 dollars in SPY faint behind it.">'+
      grid+ticks+spyLine+segs+
      '<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(c.eq[n-1]).toFixed(1)+'" r="4.5" '+
      'fill="'+(inNow?"var(--go)":"var(--stop)")+'"/></svg>';

    return '<div class="chart">'+
      '<h3>What the rule earned</h3>'+svg+
      key([["var(--go)","In TQQQ"],["var(--ink3)","In TLT"],
           ["var(--ink2)","SPY",1]])+
      '<div class="say"><b>$100</b> switched between TQQQ and TLT on this signal '+
      'alone, from TQQQ&rsquo;s first day in '+esc((c.from||"").slice(0,4))+
      ', would be <b>'+dollars(c.eq[n-1])+'</b> now &mdash; '+pc(st.eq_ret)+
      ', or <b>'+(st.eq_cagr*100).toFixed(1)+'% a year</b>, with a worst fall of '+
      '<b>'+Math.round(-st.eq_dd*100)+'%</b>.'+
      (st.spy_cagr===undefined ? "" :
        ' The same $100 in SPY is the dashed line at <b>'+dollars(c.spy[n-1])+
        '</b> ('+(st.spy_cagr*100).toFixed(1)+'% a year, worst fall '+
        Math.round(-st.spy_dd*100)+'%).')+
      ' Both start at $100 on the same day, so the gap between the lines is the '+
      'difference in return. '+c.switches+' switches over '+yrs.toFixed(0)+
      ' years. Gross of costs, spreads and tax; the position for each session '+
      'is the one the rule gave at the previous close.</div></div>';
  }

  // The panel showed today only, which cannot answer the question the
  // persistence rule forces: did it block yesterday as well? One blocked day
  // changes nothing - the verdict needs two in a row - so a lone red column
  // was being read as a flip already under way.
  function trailHtml(trail){
    if(!trail || !trail.length) return "";
    var rows = [["g1","Absolute vol"],["g2","Vol shock"],["g3","Drawdown"]];
    var head = '<tr><th></th>'+trail.map(function(d){
      var p = d.date.split("-");
      return '<th><span>'+(+p[2])+'</span><i>'+MON[+p[1]-1]+'</i></th>';
    }).join("")+'</tr>';
    var body = rows.map(function(r){
      return '<tr><td class="lab">'+r[1]+'</td>'+trail.map(function(d){
        return '<td class="'+(d[r[0]]?"p":"b")+'" title="'+esc(d.date)+'">'+
               (d[r[0]]?"&middot;":"✕")+'</td>';
      }).join("")+'</tr>';
    }).join("");
    var verdict = '<tr class="vr"><td class="lab">Verdict</td>'+trail.map(function(d){
      return '<td class="'+(d.sig?"p":"b")+'">'+(d.sig?"T":"B")+'</td>';
    }).join("")+'</tr>';
    var runs = 0, max = 0;
    trail.forEach(function(d){ runs = d.all ? 0 : runs+1; if(runs>max) max=runs; });
    var today = trail[trail.length-1];
    var note = today.all
      ? (max >= 1 ? "A gate blocked inside this fortnight but not on consecutive "+
                    "sessions, so the verdict never moved." 
                  : "No gate has blocked in this fortnight.")
      : (trail.length>1 && !trail[trail.length-2].all
          ? "<b>Blocked two sessions running &mdash; the verdict has flipped.</b>"
          : "Blocked today only. It takes a second consecutive blocked session "+
            "to move the verdict, so nothing changes yet.");
    return '<div class="trail"><h3>The last '+trail.length+' sessions</h3>'+
      '<div class="tw"><table>'+head+body+verdict+'</table></div>'+
      '<div class="say">&middot; passed, &#10005; blocked. <b>T</b> in TQQQ, '+
      '<b>B</b> in Treasuries. '+note+'</div></div>';
  }

  function gateHtml(g, params){
    if(!g || !g.ok){
      return h2("The Gate")+'<div class="verdict unk"><div class="big">Unavailable</div>'+
        '<div class="sub">'+esc((g&&g.error)||"No reading produced.")+'</div></div>';
    }
    var hold = g.signal === 1;
    var sub = (g.blockers && g.blockers.length)
      ? "Blocked by "+g.blockers.join(" and ")+"."
      : "All three gates pass.";
    var rows = [
      // The threshold line has to agree with the reading beside it. Writing a
      // flat "below 1.10" next to a value of 1.22 states something false on
      // exactly the days the gate is doing its job, so it tracks the state.
      {lab:"Absolute volatility", sm:"20-day, annualised", ok:g.g1,
       num:(g.v20*100).toFixed(1)+"%", t:(g.g1?"below":"above")+" 35%"},
      // Three decimals, not two. At 1.0989 a two-decimal reading prints "1.10"
      // directly beside the words "below 1.10", which reads as a gate sitting
      // on its own ceiling when it is in fact passing with 0.001 to spare.
      {lab:"Volatility shock", sm:"20-day against its 250-day normal", ok:g.g2,
       num:g.ratio.toFixed(3), t:(g.g2?"below":"above")+" 1.10"},
      {lab:"Drawdown", sm:Math.round((params.dd_exit+g.dd)*100)+" points of further fall before it exits",
       ok:g.g3, num:(g.dd*100).toFixed(1)+"%", t:"exit below −20%"}
    ];
    return h2("The Gate")+
      '<div class="verdict '+(hold?"go":"stop")+'">'+
        '<div class="big">'+(hold?"Hold TQQQ":"Hold Treasuries")+'</div>'+
        (hold?'':'<div class="tiny">20-year Treasuries &mdash; TLT, or VGLT / SPTL.</div>')+
        '<div class="sub">'+esc(sub)+'</div>'+
        '<div class="tiny">Unchanged for '+g.held+' sessions'+
          (g.since?', since '+esc(fmtDate(g.since)):'')+
          '. Reading the close of '+esc(fmtDate(g.date))+'; act at the next one.</div>'+
      '</div>'+
      '<div class="gates">'+rows.map(function(r){
        return '<div class="grow '+(r.ok?"ok":"no")+'">'+
          '<div class="lab">'+esc(r.lab)+'<span class="sm">'+esc(r.sm)+'</span></div>'+
          '<div class="num">'+esc(r.num)+'<span class="t">'+r.t+'</span></div></div>';
      }).join("")+'</div>'+
      trailHtml(g.trail);
  }

  // The gate used to return its verdict, its charts and its spell list as one
  // block, which is the only shape that works in a single column. On a wide
  // screen they want different widths - the verdict is a headline, the charts
  // want every pixel available, the spell list is a narrow column of figures -
  // so they are built separately and placed by the grid.
  function chartsHtml(g, hold){
    if(!g || !g.ok) return "";
    return '<div class="chart" id="cbox1"></div>' +
           '<div class="chart" id="cbox2"></div>' +
           '<div class="chart" id="cbox3"></div>';
  }

  // Every quote here is from something that trades overnight, so the table is
  // worth reading at any hour - but only if it admits when a particular row
  // has gone quiet. VIX stops printing between 16:15 and 03:00 New York, and
  // a two-hour-old number shown as though it were live is the failure this
  // section was changed to fix.
  function marketsHtml(rows){
    if(!rows || !rows.length) return "";
    return h2("Markets")+
      '<div class="note">Futures, FX and crypto, against the previous '+
      'settlement. These move overnight.</div>'+
      rows.map(function(r){
        var cls=r.chg>=0?"up":"dn", sign=r.chg>=0?"+":"";
        var stale = (typeof r.age_m==="number" && r.age_m>120)
          ? '<span class="old">'+(r.age_m<1440
              ? plural(Math.round(r.age_m/60),"hr")
              : plural(Math.round(r.age_m/1440),"day"))+' old</span>'
          : "";
        return '<div class="mrow"><div class="nm">'+esc(r.label)+stale+'</div>'+
          '<div class="rt"><span class="px">'+esc(r.value)+'</span>'+
          '<span class="ch '+cls+'">'+sign+r.chg.toFixed(2)+'%</span></div></div>';
      }).join("");
  }

  function itemsHtml(items){
    if(!items || !items.length) return '<div class="item"><div class="n">Nothing today.</div></div>';
    return items.map(function(it){
      var head=esc(it.title||it.headline||"—");
      if(it.url) head='<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+head+'</a>';
      var age="";
      if(typeof it.age_h==="number")
        age = it.age_h<1 ? "just now"
            : (it.age_h<24 ? plural(Math.round(it.age_h), "hour")+" ago"
                           : plural(Math.round(it.age_h/24), "day")+" ago");
      var meta=[it.source||it.company, age].filter(Boolean).join("  ·  ");
      var note=it.why||it.note||"";
      return '<div class="item"><div class="h">'+head+'</div>'+
        (meta?'<div class="m">'+esc(meta)+'</div>':'')+
        (note?'<div class="n">'+esc(note)+'</div>':'')+'</div>';
    }).join("");
  }

  function weatherHtml(w){
    if(!w||!w.ok) return "";
    return h2("New York")+'<div class="wx"><div class="t">'+w.now+'&deg;</div><div>'+
      '<div class="d"><b>'+esc(w.desc)+'</b>, high '+w.high+'&deg; and low '+w.low+
      '&deg;, with a '+w.precip+'% chance of rain.</div>'+
      '<div class="s">Sunset '+esc(w.sunset)+'. Tomorrow '+
      esc(String(w.tmw_desc).toLowerCase())+', '+w.tmw_high+'&deg;.</div></div></div>';
  }

  function render(live, offline){
    var d=new Date();
    $("date").textContent = d.toLocaleDateString("en-GB",
      {weekday:"long", day:"numeric", month:"long", year:"numeric"});

    var g = live.gate, hold = !!(g && g.ok && g.signal === 1);
    var hl = live.headlines || {};
    var reads = [["markets","Market news"],["ai_liability","AI liability"],
                 ["world","World"],["uk","England"]]
      .filter(function(p){ return hl[p[0]] && hl[p[0]].length; });

    // Four reading sections into three columns: World and England are the two
    // that belong together, so they share the last one.
    var cols = reads.length > 3
      ? [[reads[0]], [reads[1]], reads.slice(2)]
      : reads.map(function(r){ return [r]; });

    var html =
      (offline ? '<div class="msg">Offline &mdash; showing the last edition you loaded.</div>' : '') +
      '<section class="r-verdict">' +
        gateHtml(g, live.params||{rv_thr:0.35,vr_thr:1.10,dd_exit:0.20}) +
      '</section>' +
      '<section class="r-side">' + marketsHtml(live.markets) +
        weatherHtml(live.weather) + '</section>' +
      '<div class="r-evidence"><section>' + chartsHtml(g, hold) + '</section>' +
        '<section>' + ((g && g.ok) ? runsHtml(g.history.runs||[]) : "") + '</section></div>' +
      '<div class="r-read">' + cols.map(function(col){
        return '<section>' + col.map(function(p){
          return h2(p[1]) + itemsHtml(hl[p[0]]);
        }).join("") + '</section>';
      }).join("") + '</div>';

    $("body").innerHTML = html;

    // Every chart sizes its viewBox to the element it lands in, so a 13px
    // label is 13px and a 2px stroke is 2px whatever the column width. That
    // width only exists once the grid has laid out, so each chart is drawn
    // into a measured placeholder rather than guessed at from the window.
    if(g && g.ok) [["cbox1", chartHtml], ["cbox2", zoomHtml],
                   ["cbox3", curveHtml]].forEach(function(pair){
      var box = $(pair[0]);
      if(box) box.outerHTML = pair[1](g.history, hold, box.clientWidth) || "";
    });

    $("foot").innerHTML = "Refreshed "+freshness(live.updated)+
      (live._src === "file" ? " from the last scheduled run" : "")+
      ". Gate logic is the tested rule from tqqq-strategy/spec.py, computed on QQQ "+
      "closes. Build "+BUILD+". Not investment advice.";
  }

  // This used to print the raw stamp - "2026-10-30 09:45:13 UTC" - which to a
  // New York reader at breakfast looks like a time in the future, so a stalled
  // refresh read as a current one. Say how old it is instead, and embolden it
  // past six hours, because GitHub drops about half the scheduled runs and a
  // gap should be visible without doing the arithmetic.
  function freshness(iso){
    if(!iso) return "at an unknown time";
    var t = new Date(iso);
    if(isNaN(t)) return esc(String(iso));
    var h = (Date.now() - t) / 3600000;
    var ago = h < 1.5 ? "just now"
            : h < 48  ? plural(Math.round(h), "hour") + " ago"
                      : plural(Math.round(h / 24), "day") + " ago";
    var when = t.toLocaleString([], {month:"short", day:"numeric",
                                     hour:"2-digit", minute:"2-digit"});
    return (h > 6 ? "<b>" + ago + "</b>" : ago) + " (" + esc(when) + ")";
  }

  function load(announce){
    var btn=$("refresh");
    if(announce){ btn.disabled=true; btn.textContent="Refreshing…"; }
    var done=function(ok){
      if(!announce) return;
      btn.disabled=false;
      btn.textContent = ok
        ? "Updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})
        : "Refresh failed — tap to retry";
      setTimeout(function(){ btn.textContent="Refresh"; }, 4000);
    };
    // No cache-buster on the API: a unique URL every time would miss the edge
    // cache on every load, so each refresh would rebuild from scratch and put
    // the whole feed list through again. cache:"no-store" keeps the browser
    // from holding its own copy, which is the part that actually went stale.
    var grab = function(url, bust){
      return fetch(bust ? url+"?t="+Date.now() : url, {cache:"no-store"})
        .then(function(r){
          if(!r.ok) throw new Error(url+" HTTP "+r.status);
          return r.json();
        });
    };
    var src = API ? "live" : "file";
    var chain = API
      ? grab(API, false).catch(function(){ src = "file"; return grab(FALLBACK, true); })
      : grab(FALLBACK, true);

    chain.then(function(j){
      j._src = src;
      try{ localStorage.setItem(CACHE, JSON.stringify({live:j,build:BUILD})); }catch(e){}
      render(j,false); done(true);
    }).catch(function(e){
      done(false);
      var c=localStorage.getItem(CACHE);
      if(c){ try{ var p=JSON.parse(c); render(p.live,true); return; }catch(_){} }
      $("body").innerHTML='<div class="msg">Could not load the edition: '+esc(e.message||e)+'</div>';
    });
  }

  $("refresh").addEventListener("click", function(){ load(true); });
  // Only paint from cache when it came from this build; an older cache can be
  // missing fields this version renders.
  var c=localStorage.getItem(CACHE);
  if(c){ try{ var p=JSON.parse(c); if(p.build===BUILD) render(p.live,true); }catch(e){} }
  load(false);

  // The page keeps itself up to date, because nothing else can.
  //
  // GitHub Pages serves index.html with Cache-Control: max-age=600 and offers
  // no way to change that - there is no header configuration on Pages at all.
  // Worse, a page added to the home screen on iOS runs without a reload button
  // and can hold its copy of the HTML for far longer than ten minutes. The
  // result looked exactly like a broken deploy: data/live.json updates on
  // schedule, so the paper keeps showing fresh headlines, while the structure
  // around them - sections, charts, the lot - stays weeks behind, because that
  // part lives in the cached HTML.
  //
  // So the running page fetches its own source past the cache and compares the
  // build stamp. A newer one is loaded under a fresh query string rather than
  // via reload(), because a plain reload is free to serve the same cached copy
  // again, while a URL the browser has never seen must go to the network. The
  // sessionStorage guard means a CDN still serving the old file costs one
  // wasted navigation, not a loop.
  setTimeout(function(){
    try{
      fetch("index.html", {cache:"no-store"})
        .then(function(r){ return r.ok ? r.text() : ""; })
        .then(function(t){
          var m = t.match(/var BUILD = "([^"]+)"/);
          if(!m || m[1] === BUILD) return;
          if(sessionStorage.getItem("seenbuild") === m[1]) return;
          sessionStorage.setItem("seenbuild", m[1]);
          location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
        })
        .catch(function(){});
    }catch(e){}
  }, 1200);
})();
</script>
</body>
</html>
